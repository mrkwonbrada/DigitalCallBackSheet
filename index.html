<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#d71920">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="콜백싯">
  <title>디지털 콜백싯</title>
  <link rel="stylesheet" href="./style.css?v=20260604-4">
</head>
<body>
  <header class="app-header">
    <div class="app-title">
      <p class="eyebrow">DIGITAL CALLBACK SHEET</p>
      <h1>디지털 콜백싯</h1>
    </div>
    <button id="saveButton" class="primary-button save-button" type="button">저장</button>
  </header>

  <aside class="summary-bar" aria-label="오늘의 요약 통계">
    <div class="summary-grid" id="summaryStats"></div>
  </aside>

  <main class="app-shell">
    <section class="panel" aria-labelledby="loadTitle">
      <div class="section-heading">
        <h2 id="loadTitle">저장 기록</h2>
        <div class="action-group">
          <button id="shareButton" class="secondary-button" type="button">공유하기</button>
          <button id="csvButton" class="secondary-button" type="button">CSV 다운로드</button>
        </div>
      </div>
      <div class="saved-row">
        <select id="savedDates" aria-label="저장된 날짜 목록">
          <option value="">저장된 날짜 선택</option>
        </select>
        <button id="loadButton" class="secondary-button" type="button">불러오기</button>
      </div>
      <p id="saveStatus" class="status-message" aria-live="polite"></p>
    </section>

    <section class="panel" aria-labelledby="basicTitle">
      <div class="section-heading">
        <h2 id="basicTitle">기본 정보</h2>
      </div>
      <div class="form-grid">
        <label>이름<input id="name" data-basic="name" type="text" autocomplete="name"></label>
        <label>날짜<input id="date" data-basic="date" type="date"></label>
        <label>날씨<input id="weather" data-basic="weather" type="text" placeholder="맑음"></label>
        <label>팀원 이름<input id="teamMember" data-basic="teamMember" type="text"></label>
        <label>장소명<input id="placeName" data-basic="placeName" type="text"></label>
        <label>주소<input id="address" data-basic="address" type="text"></label>
        <label>
          테리토리 코드
          <input id="territoryCode" data-basic="territoryCode" type="text" inputmode="text" maxlength="5" pattern="([A-Za-z]{4}|[0-9]{5})" placeholder="ABCD 또는 12345">
        </label>
        <label class="wide-field">오늘의 테마<textarea id="theme" data-basic="theme" rows="3" placeholder="오늘의 목표나 집중할 부분"></textarea></label>
      </div>
    </section>

    <section class="panel" aria-labelledby="hourlyTitle">
      <div class="section-heading">
        <h2 id="hourlyTitle">시간별 활동 기록</h2>
        <button id="addHourButton" class="primary-button" type="button">+ 시간 추가</button>
      </div>
      <div id="hourlyRecords" class="hourly-list"></div>
    </section>

    <section class="panel" aria-labelledby="signupTitle">
      <div class="section-heading">
        <h2 id="signupTitle">사인업 상세 기록</h2>
        <button id="addSignupButton" class="primary-button" type="button">+ 사인업 추가</button>
      </div>
      <div id="signupForms" class="signup-forms"></div>
      <div class="signup-table-wrapper">
        <table class="signup-table">
          <thead>
            <tr>
              <th>후원자</th>
              <th>시간</th>
              <th>시리얼</th>
              <th>나이/년생</th>
              <th>성별</th>
              <th>금액</th>
              <th>결제</th>
              <th>은행/카드사</th>
              <th>출금일</th>
              <th>Obj</th>
              <th>Handling</th>
              <th>퀄리티</th>
              <th>소득공제</th>
              <th>비고</th>
            </tr>
          </thead>
          <tbody id="signupSummary"></tbody>
        </table>
      </div>
    </section>
  </main>

  <template id="hourlyTemplate">
    <article class="hour-card">
      <div class="hour-card-head">
        <label class="hour-time-label">
          시간
          <input class="hour-time-input" type="text" placeholder="12시">
        </label>
        <span class="signup-badge"></span>
        <button class="danger-button delete-hour" type="button">삭제</button>
      </div>
      <div class="counter-grid"></div>
      <label>기타 메모<input class="hour-memo" type="text" placeholder="짧은 메모"></label>
    </article>
  </template>

  <template id="counterTemplate">
    <div class="counter-row">
      <span class="counter-label"></span>
      <div class="counter-control">
        <button class="counter-button minus" type="button" aria-label="감소">−</button>
        <input class="counter-input" type="number" min="0" inputmode="numeric">
        <button class="counter-button plus" type="button" aria-label="증가">+</button>
      </div>
    </div>
  </template>

  <template id="signupTemplate">
    <article class="signup-card">
      <div class="signup-card-head">
        <button class="signup-toggle" type="button"></button>
      </div>
      <div class="signup-body form-grid">
        <label>시리얼넘버<input data-signup="serialNumber" type="text"></label>
        <label>나이 또는 년생<input data-signup="ageOrBirthYear" type="text" inputmode="numeric"></label>
        <div class="choice-field" data-choice-field="gender">
          <span>성별</span>
          <div class="choice-buttons">
            <button data-choice="남" type="button">남</button>
            <button data-choice="여" type="button">여</button>
          </div>
        </div>
        <label>시간<input data-signup="signupTime" type="time"></label>
        <div class="choice-field" data-choice-field="paymentType">
          <span>결제수단</span>
          <div class="choice-buttons">
            <button data-choice="카드" type="button">카드</button>
            <button data-choice="계좌" type="button">계좌</button>
          </div>
        </div>
        <label>은행명 또는 카드사명<input data-signup="bankOrCardCompany" type="text"></label>
        <div class="choice-field" data-choice-field="withdrawalDate">
          <span>출금일</span>
          <div class="choice-buttons">
            <button data-choice="1일" type="button">1일</button>
            <button data-choice="15일" type="button">15일</button>
          </div>
        </div>
        <label>후원자 이름<input data-signup="donorName" type="text" autocomplete="name"></label>
        <div class="choice-field" data-choice-field="obj">
          <span>Obj</span>
          <div class="choice-buttons">
            <button data-choice="O" type="button">O</button>
            <button data-choice="X" type="button">X</button>
          </div>
        </div>
        <div class="choice-field" data-choice-field="handling">
          <span>Handling</span>
          <div class="choice-buttons">
            <button data-choice="O" type="button">O</button>
            <button data-choice="X" type="button">X</button>
          </div>
        </div>
        <div class="choice-field" data-choice-field="quality">
          <span>퀄리티</span>
          <div class="choice-buttons">
            <button data-choice="O" type="button">O</button>
            <button data-choice="△" type="button">△</button>
            <button data-choice="X" type="button">X</button>
          </div>
        </div>
        <div class="choice-field" data-choice-field="taxDeduction">
          <span>소득공제</span>
          <div class="choice-buttons">
            <button data-choice="O" type="button">O</button>
            <button data-choice="X" type="button">X</button>
          </div>
        </div>
        <div class="choice-field wide-field" data-choice-field="donationAmount">
          <span>후원금액</span>
          <div class="choice-buttons amount-buttons">
            <button data-choice="30000" type="button">3만원</button>
            <button data-choice="50000" type="button">5만원</button>
            <button data-choice="70000" type="button">7만원</button>
            <button data-choice="100000" type="button">10만원</button>
            <button data-choice="custom" type="button">직접입력</button>
          </div>
        </div>
        <label class="custom-amount hidden">직접입력 금액<input data-signup="donationAmount" type="number" min="0" step="1000" inputmode="numeric"></label>
        <label class="wide-field">비고<textarea data-signup="note" rows="3"></textarea></label>
      </div>
      <div class="signup-actions">
        <button class="confirm-signup primary-button" type="button">확인</button>
        <button class="edit-signup secondary-button" type="button">수정</button>
        <button class="delete-signup danger-button" type="button">삭제</button>
      </div>
    </article>
  </template>

  <script src="./app.js?v=20260604-4" defer></script>
</body>
</html>
